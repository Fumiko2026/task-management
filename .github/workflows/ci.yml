name: CI

# PR を作る・更新したとき、と、main に統合されたときに、テストを自動で実行する。
on:
  pull_request:
  push:
    branches: [main]

# 読むだけの権限にする(CI からは、何も書き換えない)。
permissions:
  contents: read

# 同じ PR で続けて push したら、古い実行は止める。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: バックエンドのテスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # テスト専用の DB(pom.xml の既定は jdbc:postgresql://localhost:5432/taskmanagement_test)。
      # パスワードは、この CI の中だけで使う使い捨ての値。本物のパスワードではない。
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: taskmanagement_test
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: ci-only-password
          TZ: Asia/Tokyo
          PGTZ: Asia/Tokyo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskuser -d taskmanagement_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_USER: taskuser
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: テストを実行する
        working-directory: backend
        run: ./mvnw --batch-mode test

  frontend:
    name: フロントエンドのテスト
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      # 型の検査(tsc)を含む
      - run: npm run build
