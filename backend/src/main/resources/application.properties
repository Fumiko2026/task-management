spring.application.name=task-management

# 待ち受けを、このパソコンの中(127.0.0.1)だけにする(要件 NM-01)。
# 既定のままだと、同じ Wi-Fi の別の端末から、ログインなしで、API を直接呼べてしまう。
# iPhone などで画面を見るときは、画面のサーバー(Vite)が、パソコンの中で、この API へ中継する。
server.address=127.0.0.1

# DB 接続(Docker の PostgreSQL)。パスワードは環境変数 DB_PASSWORD で渡す(ここには書かない)。
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskmanagement}
spring.datasource.username=${DB_USER:taskuser}
spring.datasource.password=${DB_PASSWORD}

# 起動時にテーブルを作る(db/schema.sql)。IF NOT EXISTS なので、何度起動しても壊れない。
# 日本語のコメントを含むため、文字コードは UTF-8 を指定する。
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.encoding=UTF-8

# 動いているかの確認(/actuator/health)。公開するのは health だけで、詳細(DB の名前など)は出さない。
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
